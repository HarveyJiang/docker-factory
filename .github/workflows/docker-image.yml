name: build-openchamber

on:
  schedule:
    - cron: '0 0 15 * *'      # 每6小时检查一次
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if upstream unchanged'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: https://github.com/btriapitsyn/openchamber.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 需要写 LAST_BUILD 文件
      packages: write    # 需要推 ghcr
    steps:
      - uses: actions/checkout@v5

      - name: Get upstream HEAD
        id: upstream
        run: echo "sha=$(git ls-remote $UPSTREAM_REPO refs/heads/$UPSTREAM_BRANCH | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Check for updates
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f LAST_BUILD ] && [ "$(cat LAST_BUILD)" = "${{ steps.upstream.outputs.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream and apply custom Dockerfile
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch $UPSTREAM_BRANCH $UPSTREAM_REPO src
          cp Dockerfile src/Dockerfile

      - name: Login to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU and Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip == 'false'
      - name: Lowercase repo
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        
      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 双缓存：registry 用于跨分支共享，gha 用于 builder/vite 增量缓存
          # 效果：仅更新基础包（Dockerfile.base）时，builder 层命中缓存，build:web 30s 内完成
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:cache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:cache,mode=max
            type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:main-${{ steps.upstream.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.date.outputs.date }}

      - name: Report image size
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "============================================"
          echo "           IMAGE SIZE REPORT"
          echo "============================================"
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ steps.date.outputs.date }}"
          docker buildx imagetools inspect "$IMAGE" 2>&1
          echo "============================================"
          echo "Image: $IMAGE"
          echo "============================================"

      - name: Record last built SHA
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > LAST_BUILD
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add LAST_BUILD
          git commit -m "chore: record last built ${{ steps.upstream.outputs.sha }}" || true
          git push
