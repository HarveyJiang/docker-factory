name: build-openchamber

on:
  schedule:
    - cron: '0 */6 * * *'      # 每6小时检查一次
  workflow_dispatch: {}        # 也支持手动触发

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: https://github.com/btriapitsyn/openchamber.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 需要写 LAST_BUILD 文件
      packages: write    # 需要推 ghcr
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream HEAD
        id: upstream
        run: echo "sha=$(git ls-remote $UPSTREAM_REPO refs/heads/$UPSTREAM_BRANCH | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Check for updates
        id: check
        run: |
          if [ -f LAST_BUILD ] && [ "$(cat LAST_BUILD)" = "${{ steps.upstream.outputs.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream and apply custom Dockerfile
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch $UPSTREAM_BRANCH $UPSTREAM_REPO src
          cp Dockerfile src/Dockerfile

      - name: Login to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU and Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip == 'false'

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:main-${{ steps.upstream.outputs.sha }}

      - name: Record last built SHA
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > LAST_BUILD
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add LAST_BUILD
          git commit -m "chore: record last built ${{ steps.upstream.outputs.sha }}" || true
          git push
