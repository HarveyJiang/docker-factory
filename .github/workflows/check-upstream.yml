name: check-upstream

# 只手动跑：查询上游 opencode/openchamber 版本，与 .upstream.json 比对，
# 把查询结果打印出来供人工判断是否需要构建。
# 不再自动触发任何构建 workflow（用户要求全部手动）。
# 注意：本 workflow 只做「查版本」并更新 .upstream.json，构建请手动跑
# build-openchamber-base / build-openchamber。
# 已查过的版本记在 .upstream.json，避免重复提示。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # 需要触发其他 workflow

env:
  # 跟踪策略（两边通用）：major=只跟大版本；minor=忽略纯 patch（第三位），第一、二位变就编译；all=任何新版都构建。
  OPENCODE_POLICY: minor
  OPENCHAMBER_POLICY: minor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check @opencode/cli
        id: opencode
        run: |
          latest="$(npm view @opencode/cli version)"
          current="$(jq -r '.opencode_cli // empty' .upstream.json 2>/dev/null)"
          echo "latest=$latest current=$current"
          build=false
          if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
            if [ "$OPENCODE_POLICY" = "major" ]; then
              [ "${latest%%.*}" != "${current%%.*}" ] && build=true
            elif [ "$OPENCODE_POLICY" = "minor" ]; then
              [ "${latest%.*}" != "${current%.*}" ] && build=true
            else
              build=true
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Check upstream openchamber release
        id: app
        run: |
          tag="$(gh api repos/btriapitsyn/openchamber/releases/latest --jq .tag_name)"
          current="$(jq -r '.openchamber_release // empty' .upstream.json 2>/dev/null)"
          echo "tag=$tag current=$current"
          # 去掉前导 v 后比较：minor 策略比 major.minor，major 策略比 major
          norm() { echo "${1#v}" | cut -d. -f"$2"; }
          build=false
          if [ -n "$tag" ] && [ "$tag" != "$current" ]; then
            if [ "$OPENCHAMBER_POLICY" = "major" ]; then
              [ "$(norm "$tag" 1)" != "$(norm "$current" 1)" ] && build=true
            elif [ "$OPENCHAMBER_POLICY" = "minor" ]; then
              [ "$(norm "$tag" 1-2)" != "$(norm "$current" 1-2)" ] && build=true
            else
              build=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary (build manually if needed)
        run: |
          {
            echo "### 上游版本检查（仅查询，不自动构建）"
            echo ""
            echo "| 组件 | 上游最新 | 记录中 | 需构建 |"
            echo "|---|---|---|---|"
            echo "| @opencode/cli | ${{ steps.opencode.outputs.latest }} | ${{ steps.opencode.outputs.current }} | ${{ steps.opencode.outputs.build }} |"
            echo "| btriapitsyn/openchamber | ${{ steps.app.outputs.tag }} | ${{ steps.app.outputs.current }} | ${{ steps.app.outputs.build }} |"
            echo ""
            echo "需要构建时，请手动触发对应 workflow。"
          } >> "$GITHUB_STEP_SUMMARY"
