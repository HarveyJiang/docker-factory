name: build-deepseek-harness-base

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 02:00 UTC
  push:
    paths:
      - "images/deepseek-harness/Dockerfile.base"
      - ".github/workflows/build-deepseek-harness-base.yml"
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/harveyjiang/deepseek-harness-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU and Buildx
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/deepseek-harness/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Report image size
        run: |
          echo "### 📦 Image Size Report (with Size column)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          IMAGE="${{ env.IMAGE }}:latest"
          # 轻量获取大小（无需 pull，避免 manifest list 拉取慢）
          SIZE=$(docker buildx imagetools inspect "$IMAGE" --raw 2>&1 | wc -c | xargs -I{} echo "{} bytes (manifest)"; docker buildx imagetools inspect "$IMAGE" 2>&1 | grep -i "Size" | head -1 || echo "see imagetools")
          echo "| \`$IMAGE\` | **$SIZE** |" >> $GITHUB_STEP_SUMMARY
          echo "Image: $IMAGE Size: $SIZE"
          docker buildx imagetools inspect "$IMAGE" 2>&1 | head -60
