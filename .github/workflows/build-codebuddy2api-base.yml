name: build-codebuddy2api-base

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 02:00 UTC
  push:
    paths:
      - "images/codebuddy2api/Dockerfile.base"
      - ".github/workflows/build-codebuddy2api-base.yml"
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/harveyjiang/codebuddy2api-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU and Buildx
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: ./images/codebuddy2api
          file: ./images/codebuddy2api/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Report image size (human-readable)
        run: |
          IMAGE="${{ env.IMAGE }}:latest"
          echo "### 📦 Image Size (human-readable)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          docker pull "$IMAGE" --quiet || true
          SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)
          if [ -z "$SIZE" ]; then SIZE=$(docker buildx imagetools inspect "$IMAGE" 2>&1 | grep -i "Size" | head -1 || echo "unknown"); fi
          echo "| \`$IMAGE\` | **$SIZE** |" >> $GITHUB_STEP_SUMMARY
          echo "Image $IMAGE Size: $SIZE"
          docker buildx imagetools inspect "$IMAGE" 2>&1 | head -60
