name: build-openchamber-base

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 02:00 UTC 自动检测基础层
  push:
    paths:
      - "images/openchamber/Dockerfile.base"
      - ".github/workflows/build-openchamber-base.yml"
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/harveyjiang/openchamber-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU and Buildx
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/openchamber/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Report image size
        run: |
          IMAGE="${{ env.IMAGE }}:latest"
          echo "### 📦 Image Size Report (with Size column)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          docker pull "$IMAGE" --quiet || true
          SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)
          echo "| \`$IMAGE\` | **$SIZE** | \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "Image: $IMAGE Size: $SIZE"
          docker buildx imagetools inspect "$IMAGE" 2>&1 | head -40
