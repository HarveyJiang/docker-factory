name: build-openchamber

on:
  # 用户要求：全部构建改为手动触发，不做自动/定时构建。
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if upstream unchanged'
        required: false
        default: 'false'
        type: boolean
      opencode_version:
        description: 'opencode 版本（默认 latest 自动跟上游，填具体版本号可回滚，如 2.0.15）'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/harveyjiang/openchamber
  UPSTREAM_REPO: https://github.com/openchamber/openchamber.git
  UPSTREAM_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Get upstream HEAD
        id: upstream
        run: echo "sha=$(git ls-remote $UPSTREAM_REPO refs/heads/$UPSTREAM_BRANCH | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Check for updates
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f LAST_BUILDS.json ] && [ "$(jq -r '.["openchamber"] // empty' LAST_BUILDS.json)" = "${{ steps.upstream.outputs.sha }}" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve opencode version
        id: opencode
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -n "${{ inputs.opencode_version }}" ] && [ "${{ inputs.opencode_version }}" != "latest" ]; then
            VER="${{ inputs.opencode_version }}"
          else
            VER="$(npm view @opencode/cli version)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "📦 opencode@$VER" >> $GITHUB_STEP_SUMMARY
      - name: Clone upstream and apply Dockerfile
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch $UPSTREAM_BRANCH $UPSTREAM_REPO src
          cp images/openchamber/Dockerfile src/Dockerfile
          # 构建期改上游源码的脚本（只保留 en + zh-CN 语言），Dockerfile 里 COPY 它
          cp images/openchamber/limit-i18n.mjs src/limit-i18n.mjs
      - name: Login to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU and Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip == 'false'
      - name: Get current date
        id: date
        # 只精确到天时，同一天多次构建会互相覆盖同一个 tag，
        # 无法分辨哪个是新的。加上时分秒，每次都唯一。
        # 时间用北京时间（Asia/Shanghai）：20261014-230733，与服务器本地时间一致，便于对账。
        run: |
          echo "date=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/arm64  # 仅 arm64：服务器为 aarch64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ steps.opencode.outputs.version }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:cache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.IMAGE }}:cache,mode=max
            type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main-${{ steps.upstream.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.date.outputs.stamp }}
            ${{ env.IMAGE }}:${{ steps.date.outputs.date }}

      - name: Report image size (human-readable)
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "### 📦 Image Size (human-readable)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|-----|" >> $GITHUB_STEP_SUMMARY
          for TAG in "latest" "${{ steps.date.outputs.date }}"; do
            IMAGE="${{ env.IMAGE }}:$TAG"
            docker pull "$IMAGE" --quiet || true
            SIZE=$(docker images "$IMAGE" --format "{{.Size}}" | head -1)
            if [ -z "$SIZE" ]; then SIZE="manifest-list"; fi
            echo "| \`$IMAGE\` | **$SIZE** | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
            echo "Image $IMAGE Size: $SIZE"
          done
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.date.outputs.date }}" 2>&1 | head -60 || true
      - name: Record last built SHA
        if: steps.check.outputs.skip == 'false'
        run: |
          jq --arg sha "${{ steps.upstream.outputs.sha }}" '.["openchamber"] = $sha' LAST_BUILDS.json > /tmp/LAST_BUILDS.json && mv /tmp/LAST_BUILDS.json LAST_BUILDS.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add LAST_BUILDS.json
          git commit -m "chore(openchamber): record last built ${{ steps.upstream.outputs.sha }}" || true
          git pull --rebase origin main || true
          git push || echo "push race, next run will retry"
